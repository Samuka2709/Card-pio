<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cardápio</title>
  <meta name="description" content="Cardápio digital com pedido pelo WhatsApp.">
  <!-- Prévia ao compartilhar o link (WhatsApp, Instagram, Facebook). Precisa estar no HTML: esses apps não rodam JavaScript. -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:site_name" content="Cardápio digital">
  <meta property="og:title" content="Cardápio digital com pedido pelo WhatsApp">
  <meta property="og:description" content="Veja os pratos com foto e preço, monte o pedido pelo celular e envie direto no WhatsApp, com pagamento por Pix.">
  <meta property="og:url" content="https://cardapio-gamma-jade.vercel.app/">
  <meta property="og:image" content="https://cardapio-gamma-jade.vercel.app/img/compartilhar.jpg">
  <meta property="og:image:secure_url" content="https://cardapio-gamma-jade.vercel.app/img/compartilhar.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Cardápio digital: monte o pedido pelo celular e envie no WhatsApp">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/icone-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cardápio">
  <link rel="stylesheet" href="css/estilo.css?v=18">
</head>
<body>
  <a class="pular" href="#cardapio" data-t="Pular para o cardápio">Pular para o cardápio</a>

  <header class="topo">
    <div class="capa" id="capa"></div>
    <div class="idiomas" id="idiomas" role="group" hidden></div>
    <div class="topo-corpo">
      <div class="marca">
        <div class="logo" id="logo"></div>
        <div>
          <h1 id="nome"></h1>
          <p class="status" id="status" aria-live="polite"></p>
        </div>
      </div>
      <p class="descricao" id="descricao"></p>
      <div class="acoes-topo">
        <a class="botao botao-primario" id="btn-whats-topo" target="_blank" rel="noopener">WhatsApp</a>
        <a class="botao" id="btn-mapa-topo" target="_blank" rel="noopener">Como chegar</a>
        <a class="botao" href="#informacoes" data-t="Horários">Horários</a>
      </div>
    </div>
  </header>

  <p class="aviso-demo" id="aviso-demo" data-t="Demonstração: nomes, preços e informações são exemplos e serão substituídos pelos dados do estabelecimento." hidden>Demonstração: nomes, preços e informações são exemplos e serão substituídos pelos dados do estabelecimento.</p>
  <p class="aviso-loja" id="aviso-loja" role="status" hidden></p>
  <p class="aviso-mesa" id="aviso-mesa" role="status" hidden></p>

  <nav class="categorias" id="categorias" aria-label="Categorias do cardápio" data-t-aria="Categorias do cardápio">
    <div class="categorias-trilho" id="categorias-trilho"></div>
  </nav>

  <div class="layout">
    <main id="cardapio" tabindex="-1"></main>
    <aside class="carrinho-lateral" aria-label="Seu pedido" data-t-aria="Seu pedido">
      <div id="carrinho-lateral"></div>
    </aside>
  </div>

  <footer class="rodape" id="informacoes"></footer>

  <button class="barra-pedido" id="barra-pedido" type="button" hidden>
    <span class="barra-qtd" id="barra-qtd"></span>
    <span data-t="Ver pedido">Ver pedido</span>
    <strong id="barra-total"></strong>
  </button>

  <dialog class="painel" id="dlg-produto" aria-labelledby="produto-titulo"></dialog>
  <dialog class="painel" id="dlg-carrinho" aria-label="Seu pedido" data-t-aria="Seu pedido">
    <div id="carrinho-modal"></div>
  </dialog>

  <noscript><p class="aviso-demo">Ative o JavaScript para usar o cardápio.</p></noscript>

  <script src="js/config.js?v=18"></script>
  <script src="js/idiomas.js?v=18"></script>
  <script src="js/pix.js?v=18"></script>
  <script src="js/app.js?v=18"></script>
</body>
</html>
